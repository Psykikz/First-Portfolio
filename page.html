<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junelle D. Tirasol | Portfolio Repository</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f6fa;--fg:#16202e;--line:#d5dbe6;--card:#ffffff;--accent:#5a2cff}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1521;--fg:#e8edf7;--line:#26304a;--card:#151c2c;--accent:#00e5ff}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:1.0625rem/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{max-width:46rem;margin:0 auto;padding:2.5rem 1.25rem 3rem;text-align:center}
    h1{margin:0 0 .5rem;font:700 clamp(2rem,8vw,3rem)/1.15 Georgia,serif}
    a{color:var(--accent);text-decoration:none}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:.6rem}
    .buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem;margin:1.25rem 0}
    kbd{display:inline-block;padding:.55rem 1.1rem;border:1px solid var(--line);border-bottom-width:3px;border-radius:.6rem;background:var(--card);color:var(--fg);font:600 1rem system-ui,sans-serif}
    a:hover kbd{border-color:var(--accent)}
  </style>
</head>
<body>
<main>
  <h1>Junelle D. Tirasol</h1>
  <p><b>BSIT student at the University of San Agustin, Iloilo</b></p>
  <p>Welcome to the repository of my personal web portfolio.</p>
  <div class="buttons">
    <a href="https://psykikz.github.io/First-Portfolio/"><kbd>🚀 Visit My Portfolio</kbd></a>
    <a href="https://github.com/psykikz/First-Portfolio"><kbd>📂 View the Source</kbd></a>
  </div>
</main>
</body>
</html>
